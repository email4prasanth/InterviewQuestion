name: thinkrd Dev environment Deployment

on: 
  push:
    branches: 
      - develop

jobs:
  thinkrd365-resources-deploy:
    runs-on: ubuntu-latest
    env: 
      ENVIRONMENT: 
      AZURE_CLIENT_ID: ${{secrets.Azure_credentials}}
      AZURE_CLIENT_SECRET:
      AZURE_SUBSCRIPTION:
      AZURE_TENANT_ID:
    steps:
      - name: checkout code
        uses: actions/checkout@v3
      - name: setup terraform
        uses: hashicorp/terraform-setup@v3
      - name: terraform init
      - name: terraform workspace
      - name: terraform refresh
      - name: terraform plan
      - name: terraform apply